[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster-tweets"
version = "1.0.0"
description = "Disaster tweet classification: reproducible baselines, calibrated evaluation, error analysis and a served model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kiran Bal" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
transformer = [
    "torch>=2.2",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "accelerate>=0.30",
]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
dt-train = "disaster_tweets.train:main"
dt-predict = "disaster_tweets.predict:main"
dt-compare = "disaster_tweets.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
